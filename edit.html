<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
			crossorigin="anonymous"
		/>

		<script src="https://www.gstatic.com/firebasejs/8.2.9/firebase-app.js"></script>
		<script src="https://www.gstatic.com/firebasejs/8.2.9/firebase-auth.js"></script>
		<script src="https://www.gstatic.com/firebasejs/8.2.9/firebase-firestore.js"></script>

		<script src="asset/edit.js" defer></script>

		<link rel="stylesheet" href="asset/edit.css" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
		/>

		<title>Jeju Olle Trail-나의 정보</title>
	</head>

	<body>
		<div class="MainLogin">
			<div class="Mainleft">
				<div class="box">
					<span class="Jeju-Olle-Trail">
						Jeju Olle Trail
					</span>
				</div>
			</div>
			<div class="Mainright">
				<div class="loginBox">
					<h1>
						나의 정보
					</h1>
					<div class="mb-3">
						<label for="exampleFormControlInput1" class="form-label"
							><h5>
								닉네임
							</h5></label
						>
						<input
							type="email"
							class="form-control form-control-lg"
							id="exampleFormControlInput2"
						/>
					</div>
					
					
					<div class="loginGoBox">
						<a type="button" class="btn btn-dark btn-lg" id="nicknameBtn" href=""
							>닉네임 변경</a
						>
					</div>

					<div class="mb-3">
						<label for="exampleFormControlInput1" class="form-label"
							><h5>
								아이디
							</h5></label
						>
						<input
							type="email"
							class="form-control form-control-lg"
							id="exampleFormControlInput1"
						/>
					</div>

					<div class="mb-3">
						<label for="exampleFormControlInput1" class="form-label"
							><h5>
								변경할 비밀번호
							</h5></label
						>
						<input
							type="password"
							class="form-control form-control-lg"
							id="inputPassword1"
						/>
					</div>

					<div class="mb-3">
						<label for="exampleFormControlInput1" class="form-label"
							><h5>
								변경할 비밀번호 확인
							</h5></label
						>
						<input
							type="password"
							class="form-control form-control-lg"
							id="inputPassword2"
						/>
					</div>

					<div class="loginGoBox">
						<a type="button" class="btn btn-dark btn-lg" id="joinBtn" href=""
							>비밀번호 수정하기</a
						>
						<a type="button" class="btn btn-dark btn-lg" id="withdrawalBtn" href=""
							>회원탈퇴</a
						>
					</div>
				</div>
			</div>
		</div>

		<!-- Modal -->
		<div
			class="modal fade"
			id="inputModal"
			tabindex="-1"
			aria-labelledby="exampleModalLabel"
			aria-hidden="true"
		>
			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="exampleModalLabel">회원가입 오류</h5>
						<button
							type="button"
							class="btn-close"
							data-bs-dismiss="modal"
							aria-label="Close"
						></button>
					</div>
					<div class="modal-body">
						<p>빈칸 모두 입력 해주세요</p>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
							닫기
						</button>
					</div>
				</div>
			</div>
		</div>

		<script type="text/javascript" src="asset/edit.js"></script>
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
			crossorigin="anonymous"
		></script>
	</body>
</html>
