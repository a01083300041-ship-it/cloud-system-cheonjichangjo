<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
			crossorigin="anonymous"
		/>
		<link rel="stylesheet" href="asset/join.css" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
		/>
		<script src="https://www.gstatic.com/firebasejs/8.2.9/firebase-app.js"></script>
		<script src="https://www.gstatic.com/firebasejs/8.2.9/firebase-auth.js"></script>
		<script src="https://www.gstatic.com/firebasejs/8.2.9/firebase-firestore.js"></script>

		<script src="asset/join.js" defer></script>

		<title>Jeju Olle Trail-회원가입</title>
	</head>

	<body>
		<div class="MainLogin">
			<div class="Mainleft">
				<div class="box">
					<span class="Jeju-Olle-Trail">
						Jeju Olle Trail
					</span>
				</div>
			</div>

			<div class="Mainright">
				<div class="loginBox">
					<h2>
						회원가입
					</h2>

					<form>
						<label for="Name">닉네임</label>
						<input type="text" id="Name" required />
						<br />
						<label for="id">아이디</label>
						<input type="text" id="id" required />
						<br />
						<label for="password">비밀번호</label>
						<input type="password" id="password" required />
						<br />
						<label for="confirmPassword">비밀번호 확인</label>
						<input type="password" id="confirmPassword" required />
						<br />
						<button type="submit">가입</button>
						<p id="message"></p>
					</form>
				</div>
			</div>
		</div>
		
		  <p id="message"></p> <!-- 메시지 출력을 위한 요소 -->

		<!-- Modal -->
		<div
			class="modal fade"
			id="inputModal"
			tabindex="-1"
			aria-labelledby="exampleModalLabel"
			aria-hidden="true"
		>
			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="exampleModalLabel">회원가입 오류</h5>
						<button
							type="button"
							class="btn-close"
							data-bs-dismiss="modal"
							aria-label="Close"
						></button>
					</div>
					<div class="modal-body">
						<p>빈칸 모두 입력 해주세요</p>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
							닫기
						</button>
					</div>
				</div>
			</div>
		</div>

		<script src="asset/join.js"></script>
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
			crossorigin="anonymous"
		></script>
	</body>
</html>
